<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor reg ulang, Pet Blessing 2026</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hari-h.css">
<script src="api-config.js"></script>
<script src="hari-h.js"></script>
<style>
  /* Layar untuk pengunjung di area reg ulang (TV/monitor/tablet, landscape atau portrait). */
  body{overflow:hidden;}
  .layar{height:100vh;}
  .layar{display:flex;flex-direction:column;padding:2vh 2.5vw;gap:2vh;}
  .atas{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .atas img{width:clamp(36px,5vh,60px);height:auto;}
  .atas h1{font-size:clamp(20px,3.6vh,40px);flex:1;}
  .atas .jam{font-size:clamp(18px,3vh,34px);font-weight:600;color:var(--brand-deep);}
  .meja{display:grid;grid-template-columns:1fr 1fr;gap:2vw;}
  .tile{border-radius:22px;padding:2.4vh 2vw;color:#fff;display:flex;flex-direction:column;min-width:0;}
  .tile.A{background:var(--a);} .tile.B{background:var(--b);}
  .tile .lbl{font-size:clamp(16px,2.6vh,30px);font-weight:600;opacity:.95;}
  .tile .n{font-size:clamp(90px,19vh,230px);line-height:1;font-weight:700;margin:1vh 0;}
  .tile .nm{font-size:clamp(18px,3vh,34px);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tile .pt{font-size:clamp(14px,2.2vh,24px);opacity:.95;}
  .info{display:flex;gap:2vw;flex-wrap:wrap;font-size:clamp(16px,2.6vh,28px);}
  .info b{font-size:1.3em;color:var(--brand-deep);}
  .daftar{flex:1;min-height:0;overflow:hidden;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1.2vh 1.5vw;align-content:start;}
  .it{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.2vh 1vw;display:flex;gap:12px;align-items:center;min-width:0;}
  .it .n{font-size:clamp(26px,4vh,46px);color:var(--brand-deep);min-width:2.2em;}
  .it .t{min-width:0;}
  .it .t b{display:block;font-size:clamp(15px,2.2vh,22px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .it .t span{font-size:clamp(13px,1.8vh,18px);color:var(--ink-soft);}
  .pesan{background:var(--brand-deep);color:#fff;border-radius:16px;padding:1.6vh 2vw;font-size:clamp(16px,2.6vh,28px);text-align:center;}
  @media (max-width:640px){ .meja{grid-template-columns:1fr;} }
  .kecil{font-size:12px;}
</style>
</head>
<body>
<div id="loginWrap" hidden></div>
<div id="appWrap" hidden>
  <div class="layar">
    <div class="atas">
      <img src="assets/pet-blessing-badge.png" alt="">
      <h1>Reg ulang Pet Blessing 2026</h1>
      <span class="jam num" id="jam"></span>
    </div>
    <div class="meja">
      <div class="tile A"><span class="lbl">Meja A, nomor terakhir</span><span class="n num" id="nA">…</span><span class="nm" id="nmA"></span><span class="pt" id="ptA"></span></div>
      <div class="tile B"><span class="lbl">Meja B, nomor terakhir</span><span class="n num" id="nB">…</span><span class="nm" id="nmB"></span><span class="pt" id="ptB"></span></div>
    </div>
    <div class="info" id="info"></div>
    <div class="daftar" id="daftar"></div>
    <div class="pesan">Nomor urut dibagikan sesuai urutan kedatangan. Simpan stiker nomor Anda, nomor akan dipanggil di ruang tunggu.</div>
    <div class="kecil"><span class="server-badge" id="serverBadge"></span></div>
  </div>
</div>
<script>
HariH.mulai(function(){
  var H = HariH, $ = function(id){ return document.getElementById(id); };
  setInterval(function(){ $('jam').textContent = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }); }, 1000);
  var terakhir = null;
  H.ulang(async function(){
    var st = await H.status(10);
    H.labelServer(st);
    ['A', 'B'].forEach(function(m){
      var r = st.recent.find(function(x){ return x.meja === m; });
      $('n' + m).textContent = r ? r.nomor : '…';
      $('nm' + m).textContent = r ? r.name : 'Belum ada';
      $('pt' + m).textContent = r ? r.pets.map(function(p){ return p.label + ' ' + p.name; }).join(', ') : '';
    });
    $('info').innerHTML = '<span>Sudah reg ulang <b class="num">' + st.hadir + '</b> peserta</span><span><b class="num">' + st.hewan_hadir + '</b> hewan</span>' +
      (st.dipanggil ? '<span>Ruang tunggu memanggil nomor <b class="num">' + st.dipanggil.nomor + '</b></span>' : '');
    $('daftar').innerHTML = st.recent.slice(2).map(function(r){
      return '<div class="it"><span class="n num">' + r.nomor + '</span><span class="t"><b>' + H.esc(r.name) + '</b><span>' +
        H.esc(r.pets.map(function(p){ return p.label + ' ' + p.name; }).join(', ')) + '</span></span></div>';
    }).join('');
    var top = st.recent[0] && st.recent[0].nomor;
    if(terakhir !== null && top !== terakhir) H.bunyi(880, 120);
    terakhir = top;
  }, 2000);
});
</script>
</body>
</html>
