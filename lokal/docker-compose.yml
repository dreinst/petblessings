# Server lokal hari-H di Mac: database + API yang sama dengan VPS.
# Hanya membuka port di 127.0.0.1; device lain di jaringan masuk lewat
# lokal/server.js (HTTPS 8443 dan HTTP 8080), bukan langsung ke sini.
services:
  db:
    image: postgres:16-alpine
    container_name: pblokal-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: petblessing
      POSTGRES_USER: petblessing
      POSTGRES_PASSWORD: ${DB_PW}
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petblessing"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgrest:
    image: postgrest/postgrest:v12.2.3
    container_name: pblokal-api
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTH_PW}@db:5432/petblessing
      PGRST_DB_SCHEMAS: api
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_JWT_ROLE_CLAIM_KEY: .role
      PGRST_DB_POOL: "10"
      PGRST_SERVER_PORT: "3000"
    ports:
      - "127.0.0.1:3101:3000"
    depends_on:
      db:
        condition: service_healthy
