<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pendaftaran masuk, Pet Blessing 2026</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="api-config.js"></script>
<style>
  :root{
    --ink:#2B2E22; --ink-soft:#5B5F4E; --bg:#F4F1E4; --card:#FCFAF2;
    --sage:#3F5B44; --sage-deep:#2E4433; --sage-light:#E7ECE1;
    --line:#DDD6C1;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Work Sans',sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;}
  h1,h2{font-family:'Fraunces',serif;font-weight:500;margin:0;}
  .wrap{max-width:620px;margin:0 auto;padding:32px 20px 64px;}
  a{color:var(--sage-deep);}
  header{margin-bottom:24px;}
  header a.back{font-size:13px;color:var(--ink-soft);text-decoration:none;}
  header h1{font-size:24px;color:var(--sage-deep);margin-top:10px;}
  header p{font-size:14px;color:var(--ink-soft);margin-top:6px;}

  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:18px;}
  .toolbar input{flex:1;padding:10px 12px;font-size:14px;font-family:inherit;border:1px solid var(--line);border-radius:10px;background:var(--card);}
  .toolbar button{padding:10px 14px;font-size:13px;font-family:inherit;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer;}
  .count{font-size:13px;color:var(--ink-soft);margin-bottom:14px;}

  .entry{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;}
  .entry .owner{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap;}
  .entry .owner-name{font-weight:500;font-size:15px;}
  .entry .time{font-size:12px;color:var(--ink-soft);}
  .entry .phone{font-size:13.5px;color:var(--ink-soft);margin-top:2px;}
  .entry .reg-code{font-size:12px;font-family:monospace;letter-spacing:1px;color:var(--sage-deep);background:var(--sage-light);display:inline-block;padding:2px 8px;border-radius:6px;margin-top:4px;}
  .entry .origin{font-size:13px;color:var(--ink-soft);margin-top:2px;}
  .pet-list{margin-top:10px;display:flex;flex-direction:column;gap:6px;}
  .pet-row{font-size:13.5px;padding:8px 10px;background:var(--sage-light);border-radius:8px;color:var(--sage-deep);}
  .pet-row .pet-notes{display:block;color:var(--ink-soft);margin-top:2px;font-size:12.5px;}
  .donation-row{margin-top:10px;font-size:12.5px;color:var(--ink-soft);}

  .empty,.loading,.error{text-align:center;padding:60px 20px;color:var(--ink-soft);font-size:14px;}

  .login-wrap{max-width:360px;margin:80px auto 0;padding:0 20px;}
  .login-wrap h1{font-size:22px;color:var(--sage-deep);margin-bottom:6px;}
  .login-wrap p{font-size:13.5px;color:var(--ink-soft);margin-bottom:20px;}
  .login-wrap .field{margin-bottom:14px;}
  .login-wrap label{display:block;font-size:13.5px;font-weight:500;margin-bottom:6px;}
  .login-wrap input{width:100%;padding:11px 13px;font-size:15px;font-family:inherit;border:1px solid var(--line);border-radius:10px;background:var(--card);box-sizing:border-box;}
  .login-wrap button{width:100%;padding:13px;background:var(--sage);color:#fff;border:none;border-radius:10px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;margin-top:6px;}
  .login-wrap button:disabled{opacity:.6;cursor:not-allowed;}
  .login-error{color:var(--danger, #A6423A);font-size:13px;margin-top:10px;display:none;}
  .login-error.show{display:block;}

  .toolbar-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .logout-btn{font-size:12.5px;color:var(--ink-soft);background:none;border:none;cursor:pointer;font-family:inherit;text-decoration:underline;padding:0;}
  .export-btn{padding:10px 14px;font-size:13px;font-family:inherit;border:1px solid var(--sage);border-radius:10px;background:var(--sage);color:#fff;cursor:pointer;white-space:nowrap;}
  .export-btn:disabled{opacity:.5;cursor:not-allowed;}
</style>
</head>
<body>

<div class="login-wrap" id="loginWrap">
  <h1>Login panitia</h1>
  <p>Halaman ini khusus panitia.</p>
  <div class="field">
    <label for="loginEmail">Username</label>
    <input type="text" id="loginEmail" autocomplete="username">
  </div>
  <div class="field">
    <label for="loginPassword">Password</label>
    <input type="password" id="loginPassword" autocomplete="current-password">
  </div>
  <button type="button" id="loginBtn">Masuk</button>
  <div class="login-error" id="loginError">Username atau password salah.</div>
</div>

<div class="wrap" id="appWrap" style="display:none;">
  <header>
    <div class="toolbar-top">
      <a class="back" href="index.html">&laquo; Kembali ke form</a>
      <a class="back" href="checkin.html">Scan check-in &raquo;</a>
      <button type="button" class="logout-btn" id="logoutBtn">Keluar</button>
    </div>
    <h1>Pendaftaran masuk</h1>
    <p>Data langsung dari database, khusus panitia yang sudah login.</p>
  </header>

  <div class="toolbar">
    <input type="text" id="search" placeholder="Cari nama, hewan, atau kode QR">
    <button type="button" id="refreshBtn">Muat ulang</button>
    <button type="button" class="export-btn" id="exportBtn">Export xlsx</button>
  </div>
  <div class="count" id="count"></div>

  <div id="list"><div class="loading">Memuat pendaftaran…</div></div>
</div>

<script>
(function(){
  var allRegs = [];

  var API_URL = window.PETBLESSING_API_URL;
  var TOKEN_KEY = 'petblessing_panitia_token';
  if(!API_URL){
    document.getElementById('loginWrap').innerHTML = '<div class="error">API belum dikonfigurasi. Isi api-config.js dulu.</div>';
    return;
  }

  function escapeHtml(s){
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function formatTime(iso){
    if(!iso) return '';
    var d = new Date(iso);
    if(isNaN(d.getTime())) return '';
    return d.toLocaleString('id-ID', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
  }

  // --- Login gate ---
  function showApp(){
    document.getElementById('loginWrap').style.display = 'none';
    document.getElementById('appWrap').style.display = 'block';
    load();
  }
  function showLogin(){
    document.getElementById('appWrap').style.display = 'none';
    document.getElementById('loginWrap').style.display = 'block';
  }

  function checkSession(){
    if(sessionStorage.getItem(TOKEN_KEY)) showApp(); else showLogin();
  }

  document.getElementById('loginBtn').addEventListener('click', async function(){
    var btn = this;
    var username = document.getElementById('loginEmail').value.trim();
    var password = document.getElementById('loginPassword').value;
    var err = document.getElementById('loginError');
    err.classList.remove('show');
    btn.disabled = true; btn.textContent = 'Memeriksa…';
    try{
      var res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username, password: password })
      });
      var data = await res.json().catch(function(){ return {}; });
      if(!res.ok || !data.token){ err.classList.add('show'); return; }
      sessionStorage.setItem(TOKEN_KEY, data.token);
      showApp();
    }catch(e){
      err.classList.add('show');
    }finally{
      btn.disabled = false; btn.textContent = 'Masuk';
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', function(){
    sessionStorage.removeItem(TOKEN_KEY);
    showLogin();
  });

  // --- Data ---
  async function listRegistrations(){
    var token = sessionStorage.getItem(TOKEN_KEY);
    var res = await fetch(API_URL + '/owners?select=*,pets(*)&order=submitted_at.desc', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if(res.status === 401){
      sessionStorage.removeItem(TOKEN_KEY);
      showLogin();
      throw new Error('Sesi habis, silakan login lagi');
    }
    if(!res.ok) throw new Error('Gagal memuat data (' + res.status + ')');
    var rows = await res.json();
    return (rows || []).map(function(row){
      return {
        id: row.id,
        owner: {
          name: row.name,
          phone: row.phone,
          isParishioner: row.is_parishioner,
          parishOrigin: row.parish_origin
        },
        donation: {
          amount: row.donation_amount,
          hasProof: row.donation_has_proof
        },
        pets: (row.pets || []).map(function(p){
          return { name: p.name, type: p.type, hasPhoto: p.has_photo, notes: p.notes };
        }),
        submittedAt: row.submitted_at
      };
    });
  }

  function render(regs){
    var list = document.getElementById('list');
    var count = document.getElementById('count');
    if(regs.length === 0){
      count.textContent = '';
      list.innerHTML = '<div class="empty">Belum ada pendaftaran masuk.</div>';
      return;
    }
    var totalPets = regs.reduce(function(sum,r){ return sum + r.pets.length; }, 0);
    count.textContent = regs.length + ' pemilik, ' + totalPets + ' hewan';
    list.innerHTML = regs.map(function(r){
      var petsHtml = r.pets.map(function(p){
        var notes = p.notes && p.notes !== '-' ? '<span class="pet-notes">'+escapeHtml(p.notes)+'</span>' : '';
        return '<div class="pet-row">'+escapeHtml(p.name)+' &middot; '+escapeHtml(p.type)+(p.hasPhoto ? ' &middot; ada foto' : '')+notes+'</div>';
      }).join('');
      var originLine = r.owner.isParishioner === 'bukan' && r.owner.parishOrigin
        ? '<div class="origin">Dari '+escapeHtml(r.owner.parishOrigin)+'</div>' : '';
      var donationLine = (r.donation && (r.donation.amount || r.donation.hasProof))
        ? '<div class="donation-row">Donasi: '+escapeHtml(r.donation.amount || 'tanpa jumlah')+(r.donation.hasProof ? ', ada bukti transfer' : '')+'</div>' : '';
      var shortCode = r.id ? r.id.slice(0, 8).toUpperCase() : '';
      return '<div class="entry">'+
        '<div class="owner"><span class="owner-name">'+escapeHtml(r.owner.name)+'</span><span class="time">'+formatTime(r.submittedAt)+'</span></div>'+
        (shortCode ? '<div class="reg-code">Kode: '+escapeHtml(shortCode)+'</div>' : '')+
        '<div class="phone">'+escapeHtml(r.owner.phone)+'</div>'+
        originLine+
        '<div class="pet-list">'+petsHtml+'</div>'+
        donationLine+
      '</div>';
    }).join('');
  }

  function searchBlob(r){
    var shortCode = r.id ? r.id.slice(0, 8) : '';
    return (r.owner.name+' '+r.pets.map(function(p){return p.name;}).join(' ')+' '+shortCode+' '+(r.id||'')).toLowerCase();
  }

  function applySearch(){
    var q = document.getElementById('search').value.trim().toLowerCase();
    if(!q){ render(allRegs); return; }
    render(allRegs.filter(function(r){ return searchBlob(r).indexOf(q) !== -1; }));
  }

  async function load(){
    document.getElementById('list').innerHTML = '<div class="loading">Memuat pendaftaran…</div>';
    try{
      allRegs = await listRegistrations();
      applySearch();
    }catch(e){
      document.getElementById('list').innerHTML = '<div class="error">Belum bisa memuat data. Coba muat ulang.</div>';
    }
  }

  function exportXlsx(){
    if(!allRegs.length){ return; }
    var rows = [];
    allRegs.forEach(function(r){
      if(!r.pets.length){
        rows.push(baseRow(r, null));
        return;
      }
      r.pets.forEach(function(p){ rows.push(baseRow(r, p)); });
    });

    function baseRow(r, p){
      return {
        'Nama pemilik': r.owner.name,
        'No. HP': r.owner.phone,
        'Status umat': r.owner.isParishioner === 'ya' ? 'Umat paroki' : 'Bukan umat paroki',
        'Asal paroki/daerah': r.owner.parishOrigin || '',
        'Nama hewan': p ? p.name : '',
        'Jenis hewan': p ? p.type : '',
        'Ada foto': p ? (p.hasPhoto ? 'Ya' : 'Tidak') : '',
        'Catatan hewan': p ? (p.notes || '') : '',
        'Donasi': r.donation.amount || '',
        'Ada bukti transfer': r.donation.hasProof ? 'Ya' : 'Tidak',
        'Waktu daftar': formatTime(r.submittedAt)
      };
    }

    var ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = [
      {wch:22},{wch:16},{wch:16},{wch:20},{wch:18},{wch:14},{wch:9},{wch:30},{wch:12},{wch:14},{wch:20}
    ];
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Pendaftaran');

    var stamp = new Date().toISOString().slice(0,10);
    XLSX.writeFile(wb, 'pet-blessing-2026-pendaftaran-' + stamp + '.xlsx');
  }

  document.getElementById('search').addEventListener('input', applySearch);
  document.getElementById('refreshBtn').addEventListener('click', load);
  document.getElementById('exportBtn').addEventListener('click', exportXlsx);

  checkSession();
})();
</script>
</body>
</html>
