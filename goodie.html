<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stiker dan goodie bag, Pet Blessing 2026</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hari-h.css">
<script src="api-config.js"></script>
<script src="hari-h.js"></script>
<style>
  /* Meja stiker dan goodie bag. Peserta yang baru dapat nomor urut di Pos A atau B
     muncul otomatis di sini sebagai pop up. Petugas menulis nomor di stiker,
     menyerahkan satu goodie bag per pemilik, lalu menekan "Sudah diberikan". */
  .wrap{max-width:720px;margin:0 auto;padding:12px 14px 40px;}
  header.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-bottom:10px;}
  header.top h1{font-size:22px;flex:1 1 auto;}
  .kecil{min-height:40px;padding:8px 12px;font-size:13.5px;}
  .angka{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px;}
  .kotak{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;}
  .kotak b{display:block;font-size:34px;line-height:1.1;color:var(--brand-deep);}
  .kotak span{font-size:13px;color:var(--ink-soft);}
  .kotak.tunggu{background:var(--warn-soft);border-color:#E9D28F;}
  .kotak.tunggu b,.kotak.tunggu span{color:var(--warn);}
  .cari{width:100%;padding:12px 13px;font-size:16px;border:1px solid var(--line);border-radius:12px;background:#fff;}
  h2{font-size:17px;margin:16px 0 8px;}
  .list{display:flex;flex-direction:column;gap:8px;}
  .row-btn{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;text-align:left;padding:10px 12px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;cursor:pointer;color:var(--ink);font-size:15px;}
  .row-btn:focus-visible{outline:3px solid var(--brand);outline-offset:2px;}
  .row-btn .n{flex:none;min-width:56px;font-size:28px;font-weight:700;color:var(--brand-deep);text-align:center;}
  .row-btn .info{flex:1;min-width:0;}
  .row-btn .nm{display:block;font-weight:600;overflow-wrap:anywhere;}
  .row-btn .meta{display:block;font-size:13px;color:var(--ink-soft);overflow-wrap:anywhere;}
  .row-btn .tag{flex:none;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;text-align:center;}
  .tag.tunggu{background:var(--warn-soft);color:var(--warn);}
  .tag.ok{background:var(--ok-soft);color:var(--ok);}
  .kosong{color:var(--ink-soft);font-size:14px;padding:6px 2px;}

  .pop{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(36,27,46,.78);padding:10px 10px calc(10px + env(safe-area-inset-bottom));}
  .pop-kartu{width:100%;max-width:560px;max-height:100%;overflow-y:auto;padding:18px 16px;box-shadow:0 18px 50px rgba(0,0,0,.45);}
  .pop-atas{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--ink-soft);}
  .chip{font-size:13px;font-weight:700;color:#fff;padding:5px 12px;border-radius:999px;background:var(--a);}
  .chip.B{background:var(--b);}
  .judul-pop{text-align:center;font-weight:700;font-size:16px;padding:8px;border-radius:10px;margin-top:10px;background:var(--warn-soft);color:var(--warn);}
  .judul-pop.ok{background:var(--ok-soft);color:var(--ok);}
  .nomor-besar{font-size:clamp(88px,26vw,150px);line-height:1;color:var(--brand-deep);text-align:center;margin:8px 0 2px;}
  .owner-nm{font-size:22px;font-weight:700;text-align:center;overflow-wrap:anywhere;}
  .stiker-list{display:flex;flex-direction:column;gap:8px;margin:8px 0 4px;}
  .stiker{display:flex;align-items:center;gap:14px;padding:10px 14px;border:2px dashed var(--brand-deep);border-radius:12px;background:#fff;}
  .stiker .lbl{font-size:34px;font-weight:700;color:var(--brand-deep);min-width:92px;}
  .stiker .pn{font-size:16px;font-weight:600;overflow-wrap:anywhere;}
  .stiker .pt{font-size:13px;color:var(--ink-soft);}
  .absen-list{font-size:13.5px;color:var(--ink-soft);margin-top:6px;}
  .goodie-info{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:var(--brand-light);color:var(--brand-deep);font-size:16px;text-align:center;}
  .aksi{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
  .aksi .besar{min-height:64px;font-size:19px;}
</style>
</head>
<body>
<div id="loginWrap" hidden></div>

<div id="appWrap" class="wrap" hidden>
  <header class="top">
    <h1>Stiker dan goodie bag</h1>
    <span class="server-badge on" id="lencana"></span>
    <a class="btn ghost kecil" id="kembali" hidden></a>
    <button class="btn ghost kecil" data-keluar>Keluar</button>
  </header>
  <div id="galat"></div>
  <div class="angka">
    <div class="kotak tunggu"><b class="num" id="nTunggu">0</b><span>Menunggu</span></div>
    <div class="kotak"><b class="num" id="nBeri">0</b><span>Sudah diberikan</span></div>
    <div class="kotak"><b class="num" id="nReg">0</b><span>Sudah reg ulang</span></div>
  </div>
  <input class="cari" id="cari" placeholder="Cari nomor urut atau nama pemilik" autocomplete="off" enterkeyhint="search" aria-label="Cari nomor urut atau nama pemilik">
  <h2>Menunggu stiker dan goodie bag</h2>
  <div class="list" id="listTunggu"></div>
  <h2>Sudah diberikan</h2>
  <div class="list" id="listBeri"></div>
</div>
<div class="pop" id="pop" hidden><div class="pop-kartu card" id="isiPop" role="dialog" aria-modal="true" aria-label="Peserta berikutnya"></div></div>

<script>
HariH.mulai(function(){
  var H = HariH, $ = function(id){ return document.getElementById(id); };
  // Penyerahan goodie bag = baris checkins dengan post 'pos1' (nilai lama yang tidak dipakai lagi).
  // Tanpa tabel baru, dan kunci unik (owner_id, post) di database menolak catatan kedua untuk pemilik yang sama.
  // Catatan ini hanya ada di server tempat ia dibuat (penyelaras lokal ke VPS hanya membawa reg ulang).
  var POS_GOODIE = 'pos1';
  // Stiker dicetak dari data sampai waktu ini. Pendaftar sesudahnya dan walk-in memakai stiker kosong.
  var BATAS_CETAK_STIKER = Date.parse('2026-10-03T11:36:00+07:00');

  var meja = (H.param('meja') || H.param('pos') || '').toUpperCase();
  if(meja !== 'A' && meja !== 'B') meja = null;
  var data = [], tahu = null, lewati = {}, terbuka = null, kunciPop = '', memproses = false, putaran = 0, aktif = true;
  var htmlLama = {}, versi = 0;   // versi naik tiap petugas mengubah data, supaya hasil muat yang lebih lama dibuang

  $('lencana').textContent = (H.LOKAL ? 'Server lokal' : 'Server online') + (H.UJI ? ' · MODE UJI' : '');
  if(meja){
    var k = $('kembali'); k.hidden = false;
    k.href = 'checkin.html?meja=' + meja + (H.UJI ? '&uji=1' : ''); k.textContent = 'Kembali ke Pos ' + meja;
  }

  function olah(o){
    var reg = null, g = null;
    (o.checkins || []).forEach(function(c){ if(c.post === 'reg_ulang') reg = c; else if(c.post === POS_GOODIE) g = c; });
    if(!reg || reg.arrival_number == null) return null;
    var pets = (o.pets || []).slice().sort(function(a, b){ return String(a.sticker_letter).localeCompare(String(b.sticker_letter)); });
    return { id: o.id, nama: (o.name || '').trim() || 'Tanpa nama', nomor: reg.arrival_number, pos: reg.desk, waktu: reg.checked_in_at,
      tanpaStiker: !!o.is_walkin || Date.parse(o.submitted_at) > BATAS_CETAK_STIKER,
      hadir: pets.filter(function(p){ return p.hadir !== false; }), absen: pets.filter(function(p){ return p.hadir === false; }),
      diberi: g ? g.checked_in_at : null };
  }
  function cariData(id){ for(var i = 0; i < data.length; i++) if(data[i].id === id) return data[i]; return null; }
  function menunggu(){ return data.filter(function(d){ return !d.diberi; }).sort(function(a, b){ return new Date(a.waktu) - new Date(b.waktu); }); }
  function isi(el, html){ if(htmlLama[el] !== html){ htmlLama[el] = html; $(el).innerHTML = html; } }

  async function muat(){
    var v = versi;
    try{
      // Cek sesekali apakah server ini yang sedang memberi nomor (catatan goodie bag tidak ikut pindah server).
      if(putaran++ % 10 === 0) aktif = !!(await H.status(1)).pemberi_nomor;
      var rows = await H.api('/owners?select=id,name,is_walkin,submitted_at,pets(name,type,sticker_letter,hadir),checkins!inner(post,arrival_number,desk,checked_in_at)&is_test=eq.' + H.UJI);
      if(v !== versi || memproses) return;
      data = rows.map(olah).filter(Boolean);
      isi('galat', aktif ? '' : '<div class="alert err"><b>Server ini sedang tidak memberi nomor.</b> Buka halaman ini dari alamat server yang aktif, supaya catatan goodie bag tidak terpisah.</div>');
    }catch(e){
      isi('galat', '<div class="alert err">Tidak tersambung ke server: ' + H.esc(e.message) + '. Daftar di bawah adalah data terakhir.</div>');
      return;
    }
    // Bunyi dan getar kalau ada peserta baru dari pos (bukan saat halaman pertama dibuka).
    var baru = tahu && data.some(function(d){ return !d.diberi && !tahu[d.id]; });
    tahu = tahu || {};
    data.forEach(function(d){ tahu[d.id] = 1; });
    if(baru){ H.bunyi(880, 160); setTimeout(function(){ H.bunyi(1175, 220); }, 180); if(navigator.vibrate) navigator.vibrate([150, 80, 150]); }
    render();
  }

  function kartu(d){
    return '<button type="button" class="row-btn" data-id="' + d.id + '"><span class="n num">' + d.nomor + '</span>' +
      '<span class="info"><span class="nm">' + H.esc(d.nama) + '</span><span class="meta">' +
      H.esc(d.hadir.map(function(p){ return d.nomor + (p.sticker_letter || '') + ' ' + (p.name || ''); }).join(', ')) + '</span></span>' +
      (d.diberi ? '<span class="tag ok">Sudah<br>' + H.jam(d.diberi) + '</span>'
                : '<span class="tag tunggu">' + (lewati[d.id] ? 'Dilewati' : 'Pos ' + H.esc(d.pos || '?')) + '<br>' + H.jam(d.waktu) + '</span>') + '</button>';
  }

  function render(){
    var q = $('cari').value.trim().toLowerCase();
    var cocok = function(d){ return !q || String(d.nomor) === q || d.nama.toLowerCase().indexOf(q) >= 0; };
    var tunggu = menunggu();
    var beri = data.filter(function(d){ return d.diberi; }).sort(function(a, b){ return new Date(b.diberi) - new Date(a.diberi); });
    $('nTunggu').textContent = tunggu.length; $('nBeri').textContent = beri.length; $('nReg').textContent = data.length;
    isi('listTunggu', tunggu.filter(cocok).map(kartu).join('') ||
      '<div class="kosong">' + (q ? 'Tidak ada yang cocok.' : 'Tidak ada yang menunggu. Peserta berikutnya muncul otomatis.') + '</div>');
    var b = beri.filter(cocok); if(!q) b = b.slice(0, 15);
    isi('listBeri', b.map(kartu).join('') || '<div class="kosong">' + (q ? 'Tidak ada yang cocok.' : 'Belum ada.') + '</div>');

    if(terbuka){
      var d = cariData(terbuka);
      if(!d) tutupPop();
      else if(!memproses && kunci(d) !== kunciPop) gambarPop(d);   // status berubah di perangkat lain
      else if($('sisa')) $('sisa').textContent = teksSisa(tunggu.length);
    }
    // Pop up otomatis: peserta paling lama menunggu yang belum dilewati.
    if(!terbuka && !q && document.activeElement !== $('cari')){
      var next = tunggu.filter(function(x){ return !lewati[x.id]; })[0];
      if(next) bukaPop(next.id);
    }
  }

  // ---------- pop up ----------
  function kunci(d){ return d.id + '|' + (d.diberi || ''); }
  function teksSisa(n){ return n > 1 ? (n - 1) + ' lagi menunggu' : ''; }
  function gambarPop(d){
    kunciPop = kunci(d);
    var stiker = d.hadir.map(function(p){
      return '<div class="stiker"><span class="lbl num">' + d.nomor + H.esc(p.sticker_letter || '') + '</span><span><span class="pn">' +
        H.esc(p.name || 'Nama belum diisi') + '</span><br><span class="pt">' + H.esc(p.type || 'Jenis belum diisi') + '</span></span></div>';
    }).join('');
    $('isiPop').innerHTML =
      '<div class="pop-atas"><span class="chip ' + H.esc(d.pos || '') + '">Pos ' + H.esc(d.pos || '?') + '</span><span>Reg ulang jam ' + H.jam(d.waktu) + '</span><span id="sisa">' + (d.diberi ? '' : teksSisa(menunggu().length)) + '</span></div>' +
      (d.diberi ? '<div class="judul-pop ok">Goodie bag sudah diberikan jam ' + H.jam(d.diberi) + '</div>' : '<div class="judul-pop">Nomor urut</div>') +
      '<div class="nomor-besar num">' + d.nomor + '</div>' +
      '<div class="owner-nm">' + H.esc(d.nama) + '</div>' +
      (d.tanpaStiker ? '<div class="alert warn">Peserta walk-in atau baru daftar, stiker cetaknya belum ada. Pakai stiker kosong, tulis nama pemilik dan hewannya.</div>' : '') +
      '<p style="text-align:center;margin:12px 0 0;font-weight:600">Tulis di stiker tiap hewan:</p>' +
      '<div class="stiker-list">' + stiker + '</div>' +
      (d.absen.length ? '<div class="absen-list">Tidak dibawa: ' + d.absen.map(function(p){ return H.esc(p.name); }).join(', ') + '</div>' : '') +
      (d.diberi
        ? '<div class="aksi"><button type="button" class="btn primary block" data-aksi="tutup">Tutup</button>' +
          '<button type="button" class="btn block" data-aksi="batal">Batalkan tanda sudah diberikan</button></div>'
        : '<div class="goodie-info">Serahkan <b>satu goodie bag</b> untuk pemilik ini.</div>' +
          '<div class="aksi"><button type="button" class="btn ok block besar" data-aksi="beri">Sudah diberikan</button>' +
          '<button type="button" class="btn block" data-aksi="lewati">Lewati dulu, peserta belum datang</button></div>') +
      '<div id="galatPop"></div>';
  }
  function bukaPop(id){
    var d = cariData(id); if(!d) return;
    terbuka = id; gambarPop(d);
    $('pop').hidden = false; $('isiPop').scrollTop = 0; document.body.style.overflow = 'hidden';
  }
  function tutupPop(){
    terbuka = null; kunciPop = '';
    $('pop').hidden = true; $('isiPop').innerHTML = ''; document.body.style.overflow = '';
  }
  function gagal(btn, teks, pesan){
    memproses = false; btn.disabled = false; btn.textContent = teks;
    $('galatPop').innerHTML = '<div class="alert err">' + H.esc(pesan) + '</div>'; H.bunyi(300, 300);
  }

  $('isiPop').addEventListener('click', async function(e){
    var btn = e.target.closest('[data-aksi]');
    if(!btn || btn.disabled || memproses) return;
    var d = cariData(terbuka), aksi = btn.dataset.aksi;
    if(!d || aksi === 'tutup'){ tutupPop(); render(); return; }
    if(aksi === 'lewati'){ lewati[d.id] = 1; htmlLama.listTunggu = null; tutupPop(); render(); return; }
    var teks = btn.textContent;
    if(aksi === 'beri'){
      memproses = true; btn.disabled = true; btn.textContent = 'Mencatat...';
      var baris = { owner_id: d.id, post: POS_GOODIE }; if(meja) baris.desk = meja;
      try{ await H.api('/checkins', baris); }
      catch(err){ if(!/duplicate|unique/i.test(err.message)) return gagal(btn, teks, err.message); }   // duplikat = sudah dicatat perangkat lain
      memproses = false; versi++; d.diberi = new Date().toISOString(); delete lewati[d.id];
      if(navigator.vibrate) navigator.vibrate(60);
      tutupPop(); render(); muat();
    }else if(aksi === 'batal'){
      if(!confirm('Batalkan tanda sudah diberikan untuk nomor ' + d.nomor + ' (' + d.nama + ')?')) return;
      memproses = true; btn.disabled = true; btn.textContent = 'Membatalkan...';
      try{ await H.api('/checkins?owner_id=eq.' + d.id + '&post=eq.' + POS_GOODIE, null, 'DELETE'); }
      catch(err){ return gagal(btn, teks, err.message); }
      memproses = false; versi++; d.diberi = null; lewati[d.id] = 1;   // kembali ke daftar menunggu, tidak langsung muncul lagi
      htmlLama.listTunggu = null; tutupPop(); render(); muat();
    }
  });

  function ketukKartu(e){
    var b = e.target.closest('.row-btn');
    if(b && !terbuka){ delete lewati[b.dataset.id]; bukaPop(b.dataset.id); }
  }
  $('listTunggu').addEventListener('click', ketukKartu);
  $('listBeri').addEventListener('click', ketukKartu);
  $('cari').addEventListener('input', render);
  $('cari').addEventListener('blur', function(){ setTimeout(render, 200); });

  // Layar HP tetap menyala selama halaman ini terbuka (kalau browser mendukung).
  function jagaLayar(){ try{ if(navigator.wakeLock && document.visibilityState === 'visible') navigator.wakeLock.request('screen').catch(function(){}); }catch(e){} }
  jagaLayar(); document.addEventListener('visibilitychange', jagaLayar);

  H.ulang(muat, 3000);
});
</script>
</body>
</html>
